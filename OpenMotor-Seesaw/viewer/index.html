<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenMotor Seesaw</title>
<style>
  :root { --bg:#eef1f4; --ink:#1d2733; --muted:#5b6876; --line:#c9d1da; --accent:#0b6bcb; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font:14px/1.4 -apple-system, "Helvetica Neue", Arial, sans-serif; overflow:hidden; }
  #c { position:fixed; inset:0; }
  #panel { position:fixed; top:16px; left:16px; width:260px; padding:14px 16px; background:#fffffff2;
    border:1px solid var(--line); border-radius:6px; }
  h1 { font-size:15px; margin:0 0 2px; }
  .sub { color:var(--muted); font-size:12px; margin-bottom:12px; }
  label { display:block; margin:10px 0 4px; font-size:12px; color:var(--muted); }
  input[type=range] { width:100%; }
  .row { display:flex; align-items:center; gap:8px; margin-top:8px; }
  .row label { margin:0; color:var(--ink); font-size:13px; }
  #tilt-val { color:var(--ink); font-variant-numeric:tabular-nums; }
  #tip { position:fixed; pointer-events:none; padding:4px 8px; background:#1d2733; color:#fff;
    border-radius:4px; font-size:12px; display:none; white-space:nowrap; }
  #foot { position:fixed; right:16px; bottom:12px; color:var(--muted); font-size:12px; }
  #err { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); color:#b00020; display:none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <h1>OpenMotor seesaw</h1>
  <div class="sub" id="sub">loading model.json</div>
  <label for="tilt">Arm tilt: <span id="tilt-val">0.0</span> deg (motor end down is positive)</label>
  <input id="tilt" type="range" min="-20" max="20" step="0.1" value="0">
  <div class="row"><input id="explode" type="checkbox"><label for="explode">Exploded view</label></div>
  <div class="row"><input id="wood" type="checkbox" checked><label for="wood">Show ply texture</label></div>
</div>
<div id="tip"></div>
<div id="err"></div>
<div id="foot">Drag to orbit, wheel to zoom, right drag to pan. Geometry is the laser-cut contours from generate.py.</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeef1f4);
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(35, 1, 5, 6000);
camera.position.set(650, 420, 780);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 190, 0);
controls.enableDamping = true;

const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(400, 900, 500);
scene.add(sun);

// table
const table = new THREE.Mesh(new THREE.PlaneGeometry(2400, 1600),
  new THREE.MeshStandardMaterial({ color: 0xdfe4ea, roughness: 1 }));
table.rotation.x = -Math.PI / 2; table.position.y = -0.5;
scene.add(table);
scene.add(new THREE.GridHelper(2400, 48, 0xc3ccd6, 0xd3dae2)).position.y = 0;

function grainTexture() {
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const g = c.getContext("2d");
  g.fillStyle = "#dcb887"; g.fillRect(0, 0, 256, 256);
  let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 70; i++) {
    g.strokeStyle = `rgba(120,80,40,${0.06 + rnd() * 0.12})`;
    g.lineWidth = 0.5 + rnd() * 1.5;
    const y = rnd() * 256; g.beginPath(); g.moveTo(0, y);
    g.bezierCurveTo(80, y + rnd() * 10 - 5, 170, y + rnd() * 10 - 5, 256, y + rnd() * 6 - 3); g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(1 / 120, 1 / 120);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const woodTex = grainTexture();
const mats = {
  wood: new THREE.MeshStandardMaterial({ color: 0xe0b88a, map: woodTex, roughness: 0.75 }),
  metal: new THREE.MeshStandardMaterial({ color: 0xb9c0c8, metalness: 0.95, roughness: 0.28 }),
  motor: new THREE.MeshStandardMaterial({ color: 0x2a2f36, metalness: 0.6, roughness: 0.4 }),
  prop: new THREE.MeshStandardMaterial({ color: 0x4b6584, transparent: true, opacity: 0.25, side: THREE.DoubleSide, depthWrite: false }),
  print: new THREE.MeshStandardMaterial({ color: 0x4f86c6, roughness: 0.55 }),
};
const edgeMat = new THREE.LineBasicMaterial({ color: 0x6b4a26 });

const beam = new THREE.Group();   // tilting group, origin at the pivot axis
const world = new THREE.Group();
scene.add(world, beam);
const holders = [];               // {holder, explode, group, variant}
const meshes = [];

function plateGeometry(it) {
  const pts = (a) => a.map(([x, y]) => new THREE.Vector2(x, y));
  const shape = new THREE.Shape(pts(it.contours[0]));
  for (let i = 1; i < it.contours.length; i++) shape.holes.push(new THREE.Path(pts(it.contours[i])));
  const g = new THREE.ExtrudeGeometry(shape, { depth: it.thickness, bevelEnabled: false, curveSegments: 12 });
  g.translate(0, 0, -it.thickness / 2);
  return g;
}
function cylGeometry(it) {
  if (it.hollow > 0) {   // ring: bearing or nut
    const s = new THREE.Shape(); s.absarc(0, 0, it.r, 0, Math.PI * 2, false);
    const h = new THREE.Path(); h.absarc(0, 0, it.hollow, 0, Math.PI * 2, true); s.holes.push(h);
    const g = new THREE.ExtrudeGeometry(s, { depth: it.h, bevelEnabled: false, curveSegments: it.segs });
    g.translate(0, 0, -it.h / 2);
    return g;
  }
  const open = it.hollow < 0;
  return new THREE.CylinderGeometry(it.r, it.rbot, it.h, it.segs, 1, open);
}

let model = null;
function build(m) {
  model = m;
  for (const it of m.items) {
    const geo = it.type === "plate" ? plateGeometry(it) : cylGeometry(it);
    const mesh = new THREE.Mesh(geo, mats[it.material]);
    mesh.userData.label = it.label;
    const holder = new THREE.Group();
    if (it.type === "plate") {
      mesh.matrixAutoUpdate = false;
      mesh.matrix.fromArray(it.matrix);
      const e = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 30), edgeMat);
      e.matrixAutoUpdate = false; e.matrix.fromArray(it.matrix);
      holder.add(e);
    } else {
      mesh.position.set(...it.center);
      if (it.axis === "z") mesh.rotation.x = Math.PI / 2;
      if (it.axis === "x") mesh.rotation.z = Math.PI / 2;
      if (it.hollow > 0) { // ring extruded along its local z, orient along axis
        mesh.rotation.set(0, 0, 0);
        if (it.axis === "x") mesh.rotation.y = Math.PI / 2;
        if (it.axis === "y") mesh.rotation.x = -Math.PI / 2;
      }
    }
    holder.add(mesh);
    (it.group === "beam" ? beam : world).add(holder);
    holders.push({ holder, explode: it.explode, variant: it.variant, group: it.group });
    meshes.push(mesh);
  }
  beam.position.set(0, m.params.pivot_h, 0);

  document.getElementById("sub").textContent =
    `ply ${m.params.ply} mm, arm ${m.params.arm} mm, pivot ${m.params.pivot_h} mm, M8 x ${m.params.bolt_len} bolt, no end stops`;
  const tilt = document.getElementById("tilt");
  tilt.min = -m.params.travel; tilt.max = m.params.travel;
}

const ui = {
  tilt: document.getElementById("tilt"), explode: document.getElementById("explode"),
  wood: document.getElementById("wood"),
};
let explodeF = 0;
const tmp = new THREE.Vector3();
function update() {
  if (!model) return;
  const tiltDeg = parseFloat(ui.tilt.value);
  document.getElementById("tilt-val").textContent = tiltDeg.toFixed(1);
  beam.rotation.z = -THREE.MathUtils.degToRad(tiltDeg);
  explodeF += ((ui.explode.checked ? 1 : 0) - explodeF) * 0.12;
  for (const h of holders) {
    h.holder.position.set(...h.explode.map((v) => v * explodeF));
  }
  mats.wood.map = ui.wood.checked ? woodTex : null; mats.wood.needsUpdate = true;
}

// hover labels
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), tip = document.getElementById("tip");
addEventListener("pointermove", (e) => {
  mouse.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(meshes.filter((m) => { let o = m; while (o) { if (o.visible === false) return false; o = o.parent; } return true; }), false)[0];
  if (hit) { tip.textContent = hit.object.userData.label; tip.style.display = "block";
    tip.style.left = e.clientX + 14 + "px"; tip.style.top = e.clientY + 14 + "px"; }
  else tip.style.display = "none";
});

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();

fetch("model.json").then((r) => { if (!r.ok) throw new Error("model.json " + r.status); return r.json(); })
  .then(build)
  .catch((e) => { const el = document.getElementById("err"); el.style.display = "block"; el.textContent = String(e); });

renderer.setAnimationLoop(() => { update(); controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
